<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#143224"/>
      <stop offset="100%" stopColor="#0B1A12"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="256" y1="120" x2="380" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#34D399"/>
      <stop offset="100%" stopColor="#059669"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="160" y1="150" x2="256" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FBBF24"/>
      <stop offset="100%" stopColor="#D97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>

  <!-- Subtle shield border outline -->
  <path d="M256 64C164 64 96 128 96 226C96 332 180 404 256 432C332 404 416 332 416 226C416 128 348 64 256 64Z" 
        stroke="rgba(255,255,255,0.08)" stroke-width="4" fill="none"/>

  <!-- Agricultural Emblem inside Safe Zone (x:100 to 412, y:100 to 412) -->
  <g filter="url(#glow)">
    <!-- Golden Wheat Stalks (Left side) -->
    <path d="M196 280C176 250 180 210 196 180C210 210 216 250 196 280Z" fill="url(#goldGrad)"/>
    <path d="M214 220C200 195 204 160 218 135C232 160 238 195 214 220Z" fill="#F59E0B"/>
    <path d="M240 170C230 145 234 110 248 90C258 110 262 145 240 170Z" fill="#FBBF24"/>
    
    <!-- Vibrant Emerald Sprout (Right side) -->
    <path d="M256 360C256 360 268 280 326 240C384 200 356 120 356 120C356 120 298 130 278 200C262 255 256 360 256 360Z" fill="url(#leafGrad)"/>
    <path d="M256 290C276 260 316 245 336 220C306 240 276 260 256 290Z" fill="#047857"/>

    <!-- Central Living Stalk -->
    <path d="M256 390V120" stroke="#F9FAFB" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Sun/Harvest Seed Crown -->
    <circle cx="256" cy="88" r="16" fill="#FDE047"/>
  </g>
</svg>